name: Documentation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-documentation:
    name: Validate README and firmware files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation and firmware packages
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import sys

          root = Path.cwd()
          errors = []
          readme = root / 'README.md'
          firmware_files = (
              Path('firmware/T1/TZD_CS01_V218.TFL'),
              Path('firmware/T1/XH_HMI_T1_V172.fcav'),
              Path('firmware/T5/XH_HMI_T5_V113.xha'),
          )

          if not readme.is_file():
              errors.append('README.md not found')
          else:
              content = readme.read_text(encoding='utf-8')
              for target in re.findall(r'!?\[[^\]]*\]\(([^)]+)\)', content):
                  target = target.strip().split(' "', 1)[0].strip('<>')
                  if target.startswith(('https://', 'http://', 'mailto:', '#')):
                      continue
                  local = unquote(target.split('#', 1)[0].split('?', 1)[0])
                  if local and not (root / local).is_file():
                      errors.append(f'Broken local README link: {target}')

              for firmware in firmware_files:
                  if firmware.name not in content:
                      errors.append(f'Missing README firmware reference: {firmware.name}')

          for firmware in firmware_files:
              path = root / firmware
              if not path.is_file():
                  errors.append(f'Required firmware file not found: {firmware}')
              elif path.stat().st_size == 0:
                  errors.append(f'Firmware file is empty: {firmware}')
              else:
                  print(f'Firmware present: {firmware} ({path.stat().st_size:,} bytes)')

          if errors:
              for error in errors:
                  print(f'::error::{error}')
              sys.exit(1)
          print('README, local assets, and required firmware files: OK')
          PYCODE
