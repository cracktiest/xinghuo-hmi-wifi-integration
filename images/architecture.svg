<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172b"/><stop offset="1" stop-color="#12365a"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#173856"/><stop offset="1" stop-color="#10263c"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#58cbfa"/></marker><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#020b18" flood-opacity=".4"/></filter></defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<g fill="none" stroke="#2a6485" opacity=".2"><path d="M0 170H1600M0 300H1600M0 430H1600M0 560H1600M0 690H1600M0 820H1600"/><path d="M160 0V1000M400 0V1000M640 0V1000M880 0V1000M1120 0V1000M1360 0V1000"/></g>
<text x="90" y="98" font-family="DejaVu Sans,sans-serif" font-size="45" font-weight="bold" fill="#eef9ff">Xinghuo HMI Wi-Fi Integration</text><text x="92" y="145" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#9bbcd5">Firmware paths for T1 and T5  |  Proposed server connection</text>
<!-- T1 -->
<rect x="80" y="215" width="220" height="138" rx="20" fill="url(#card)" stroke="#57c5f3" stroke-width="2" filter="url(#shadow)"/><text x="190" y="256" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="33" fill="#fff">T1 HMI</text><text x="190" y="291" text-anchor="middle" font-family="DejaVu Sans" font-size="19" fill="#91e5ff">2 firmware updates</text><text x="190" y="322" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#d7edfa">~10 minutes</text>
<rect x="380" y="198" width="420" height="170" rx="20" fill="url(#card)" stroke="#54c5f5" stroke-width="2" filter="url(#shadow)"/><text x="590" y="240" font-size="23" font-weight="bold" fill="#fff" text-anchor="middle" font-family="DejaVu Sans">STEP 1 - Mainboard</text><text x="590" y="281" font-size="20" fill="#a9e9ff" text-anchor="middle" font-family="DejaVu Sans">TZD_CS01_V218.TFL</text><text x="590" y="322" font-size="19" fill="#cadfeb" text-anchor="middle" font-family="DejaVu Sans">Enables Wi-Fi scanning</text>
<rect x="885" y="198" width="620" height="170" rx="20" fill="url(#card)" stroke="#54c5f5" stroke-width="2" filter="url(#shadow)"/><text x="1195" y="240" font-size="23" font-weight="bold" fill="#fff" text-anchor="middle" font-family="DejaVu Sans">STEP 2 - T1 interface</text><text x="1195" y="281" font-size="20" fill="#a9e9ff" text-anchor="middle" font-family="DejaVu Sans">XH_HMI_T1_V172.fcav</text><text x="1195" y="322" font-size="19" fill="#cadfeb" text-anchor="middle" font-family="DejaVu Sans">Displays Wi-Fi networks</text>
<g stroke="#58cbfa" stroke-width="5" marker-end="url(#arr)"><path d="M300 282H365"/><path d="M800 282H868"/></g>
<!-- T5 -->
<rect x="80" y="435" width="220" height="138" rx="20" fill="url(#card)" stroke="#69e2c2" stroke-width="2" filter="url(#shadow)"/><text x="190" y="477" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="33" fill="#fff">T5 HMI</text><text x="190" y="512" text-anchor="middle" font-family="DejaVu Sans" font-size="19" fill="#99f5d7">1 firmware update</text><text x="190" y="543" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#d7edfa">~3 minutes</text>
<rect x="380" y="419" width="1125" height="170" rx="20" fill="url(#card)" stroke="#69e2c2" stroke-width="2" filter="url(#shadow)"/><text x="942" y="468" font-size="23" font-weight="bold" fill="#fff" text-anchor="middle" font-family="DejaVu Sans">T5 interface update only - no mainboard update in reported workflow</text><text x="942" y="510" font-size="22" fill="#a1f0d2" text-anchor="middle" font-family="DejaVu Sans">XH_HMI_T5_V113.xha</text><text x="942" y="551" font-size="19" fill="#cadfeb" text-anchor="middle" font-family="DejaVu Sans">Displays Wi-Fi networks</text><path d="M300 502H365" stroke="#69e2c2" stroke-width="5" marker-end="url(#arr)"/>
<!-- convergence -->
<path d="M1195 368V632H790M942 589V632" fill="none" stroke="#58cbfa" stroke-width="4" stroke-dasharray="9 8"/><path d="M790 632V661" stroke="#58cbfa" stroke-width="5" marker-end="url(#arr)"/>
<rect x="560" y="674" width="460" height="100" rx="20" fill="#145277" stroke="#5dd9ff" stroke-width="2"/><text x="790" y="717" font-size="25" font-weight="bold" text-anchor="middle" fill="#fff" font-family="DejaVu Sans">Connect to factory Wi-Fi</text><text x="790" y="748" font-size="17" text-anchor="middle" fill="#c8e6f5" font-family="DejaVu Sans">Verify SSID, association and IP address</text>
<path d="M1020 722H1100" stroke="#58cbfa" stroke-width="5" marker-end="url(#arr)"/><rect x="1115" y="674" width="390" height="100" rx="20" fill="#1c4863" stroke="#69e2c2" stroke-width="2"/><text x="1310" y="718" font-size="25" font-weight="bold" text-anchor="middle" fill="#fff" font-family="DejaVu Sans">XinghuoLANServer</text><text x="1310" y="748" font-size="17" text-anchor="middle" fill="#c8e6f5" font-family="DejaVu Sans">Protocol and connectivity: to verify</text>
<rect x="80" y="836" width="1425" height="95" rx="17" fill="#091c2f" stroke="#365872" stroke-width="2"/><text x="112" y="873" font-size="19" font-weight="bold" fill="#fbe2aa" font-family="DejaVu Sans">FIELD VALIDATION REQUIRED</text><text x="112" y="904" font-size="18" fill="#afcada" font-family="DejaVu Sans">Seeing a Wi-Fi network list does not establish connection to Wi-Fi or the server. Verify hardware/firmware compatibility before flashing.</text>
</svg>